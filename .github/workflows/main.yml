name: Next.js Quality Control & Deploy

on:
  push:
    # Деплой спрацює тільки при пуші в main
    # Контроль якості спрацює при пуші в dev (якщо ти пушиш туди напряму)
    branches: ['main', 'dev']
  pull_request:
    # Перевірки для PR в обидві гілки
    branches: ['main', 'dev']

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ЕТАП 1: КОНТРОЛЬ ЯКОСТІ (Завжди для PR в main та dev)
  quality-gate:
    name: Check Code Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Prettier Check
        run: npx prettier --check .

      - name: Lint Check
        run: npm run lint

      - name: TypeScript Check
        run: npx tsc --noEmit
